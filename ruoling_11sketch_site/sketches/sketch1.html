<!doctype html><html><head><meta charset="utf-8"><title>sketch1</title>
<script src="https://cdn.jsdelivr.net/npm/p5@1.9.0/lib/p5.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/p5@1.9.0/lib/addons/p5.sound.min.js"></script>
<style>html,body{margin:0;height:100%;background:#000}</style></head><body><script>let x = 0, y =0
let vx = 0, vy = 0
function setup() { createCanvas(960,540); }
function draw() { background(0,5); filter(BLUR);
x += vx; y += vy;
if (y>=height-10||y<=10) vy*=-0.97;
if (x>=width-10||x<=10) vx*=-0.97;
vx*=0.97; vy*=0.97; circle(x,y,20);
if (mouseIsPressed){line(mouseX,mouseY,pmouseX,pmouseY);noStroke();circle(mouseX,mouseY,20);}}
function mouseReleased(){x=mouseX;y=mouseY;vx=(mouseX-pmouseX)*2;vy=(mouseY-pmouseY)*2;}</script></body></html>
